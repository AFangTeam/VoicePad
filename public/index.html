<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoicePad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- 左：素材与播放 -->
  <main class="stage">
    <header class="stage-head">
      <div class="brand">
        <span class="dot"></span>
        VoicePad
      </div>
      <div class="head-actions">
        <button id="pickFiles" class="ghost">选择文件…</button>
        <details class="path-mode">
          <summary>用文件夹路径</summary>
          <form class="picker" id="picker">
            <input id="dir" type="text" spellcheck="false"
                   placeholder="粘贴文件夹路径，回车打开（就地导出，不拷贝）" autocomplete="off">
            <button type="submit">打开</button>
          </form>
        </details>
      </div>
      <input id="fileInput" type="file" accept="video/*" multiple hidden>
    </header>

    <section class="viewer">
      <video id="video" playsinline></video>
      <div class="viewer-empty" id="viewerEmpty">
        <p>把视频拖进来</p>
        <span>可以一次拖多个，或整个文件夹</span>
      </div>

      <!-- 拖放高亮。覆盖整个左侧，拖到哪儿都能松手 -->
      <div class="dropveil" id="dropveil">
        <div class="dropveil-inner">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          </svg>
          <p>松手载入</p>
        </div>
      </div>
    </section>

    <!-- 播放进度 -->
    <section class="transport" id="transport" hidden>
      <button id="playBtn" class="icon-btn" aria-label="播放 / 暂停">
        <svg id="playIcon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
      <span class="time" id="timeNow">0:00</span>
      <div class="scrub" id="scrub">
        <div class="scrub-track">
          <i class="scrub-buffer" id="scrubBuffer"></i>
          <i class="scrub-fill" id="scrubFill"></i>
        </div>
        <div class="scrub-knob" id="scrubKnob"></div>
      </div>
      <span class="time" id="timeTotal">0:00</span>
    </section>

    <section class="clips" id="clips" hidden>
      <div class="clips-head">
        <span id="clipsCount">0 条素材</span>
        <label class="all">
          <input type="checkbox" id="selectAll" checked>
          全选
        </label>
      </div>
      <ul id="clipList"></ul>
    </section>
  </main>

  <!-- 右：调音面板 -->
  <aside class="panel">

    <div class="master">
      <div class="master-row">
        <span class="label">总音量</span>
        <span class="value" id="masterValue">100%</span>
      </div>
      <input id="master" type="range" min="0" max="160" value="100" step="1">
    </div>

    <div class="pad-wrap">
      <div class="pad-row">
      <div class="meter" title="左声道电平"><i id="meterL"></i></div>
      <div class="pad" id="pad">
        <canvas id="padCanvas"></canvas>
        <span class="pad-hint pad-hint-t">通透 · 明亮</span>
        <span class="pad-hint pad-hint-b">低沉 · 磁性</span>
        <span class="pad-hint pad-hint-l">左</span>
        <span class="pad-hint pad-hint-r">右</span>
        <div class="puck" id="puck"></div>
        <span class="pad-monitor-veil">监听原始双声道 · 调整不生效</span>
      </div>
      <div class="meter" title="右声道电平"><i id="meterR"></i></div>
      </div>
      <div class="pad-actions">
        <button class="reset" id="reset">归零</button>
        <button class="monitor" id="monitorBtn" aria-pressed="false">
          <span class="mon-dot"></span>双声道监听
        </button>
      </div>
    </div>

    <div class="readout">
      <div><span id="toneLabel">中性</span><em id="toneValue">0</em></div>
      <div><span id="balLabel">两轨等量</span><em id="balValue">0</em></div>
    </div>

    <div class="preset">
      <button id="copyBtn" title="复制当前甜点值 (⌘C)">复制</button>
      <button id="pasteBtn" title="粘贴到选中素材 (⌘V)" disabled>粘贴</button>
      <span class="preset-note" id="presetNote">找到甜点值后 ⌘C，选中其他素材 ⌘V</span>
    </div>

    <div class="curve-wrap">
      <canvas id="curve" width="600" height="180"></canvas>
    </div>

    <div class="export">
      <button id="exportBtn" disabled>导出选中素材</button>
      <p class="note">画面直通不重编码，只替换音轨</p>
      <div class="progress" id="progress" hidden>
        <div class="progress-bar"><i id="progressFill"></i></div>
        <span id="progressText"></span>
      </div>
    </div>

  </aside>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
